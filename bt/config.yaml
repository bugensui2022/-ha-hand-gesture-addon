name: "Bluetooth Classic Presence"
version: "1.0.0"
slug: "bluetooth_classic_presence"
description: "Presence detection for classic Bluetooth devices using MQTT"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
host_network: true
full_access: true
devices:
  - /dev/hci0:/dev/hci0
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  target_mac: "FC:E8:06:19:19:E3"
  scan_interval: 30
  adapter_id: "hci0"
schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str?
  mqtt_password: password?
  target_mac: str
  scan_interval: int
  adapter_id: str
