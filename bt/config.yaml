name: "Bluetooth Classic Presence"
version: "1.0.1"
slug: "bluetooth_classic_presence"
description: "通过经典蓝牙 MAC 地址扫描判断设备是否在场，通过 MQTT 暴露给 HA"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
host_network: true
full_access: true
# 允许访问蓝牙硬件
privileged:
  - NET_ADMIN
devices:
  - /dev/hci0:/dev/hci0
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  target_mac: "FC:E8:06:19:19:E3"
  scan_interval: 30
  adapter_id: "hci0"
schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str?
  mqtt_password: password?
  target_mac: str
  scan_interval: int
  adapter_id: str
