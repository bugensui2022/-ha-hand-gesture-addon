name: "Bluetooth Classic Presence"
version: "1.1.7a"
slug: "bluetooth_classic_presence"
description: "使用 l2ping 的高性能经典蓝牙设备追踪器，支持逻辑严密的自动重连和状态强制同步"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
host_network: true
full_access: true
apparmor: false
privileged:
  - NET_ADMIN
  - NET_RAW
  - SYS_ADMIN
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "mqtt"
  mqtt_password: "mqtt"
  target_mac: "FC:E8:06:19:19:E3"
  scan_interval: 2
  offline_tolerance: 3
  connection_delay: 2
  adapter_id: "hci0"
schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str?
  mqtt_password: password?
  target_mac: str
  scan_interval: int
  offline_tolerance: int
  connection_delay: int
  adapter_id: str
