name: "Bluetooth Classic Presence"
version: "1.0.7"
slug: "bluetooth_classic_presence"
description: "使用 l2ping 实现的高性能经典蓝牙检测，支持自定义离线容错次数，仅在状态变化时记录日志。"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
host_network: true
full_access: true
privileged:
  - NET_ADMIN
devices:
  - /dev/hci0:/dev/hci0
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "mqtt"
  mqtt_password: "mqtt"
  target_mac: "FC:E8:06:19:19:E3"
  scan_interval: 5
  offline_tolerance: 3
  adapter_id: "hci0"
schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str?
  mqtt_password: password?
  target_mac: str
  scan_interval: int
  offline_tolerance: int
  adapter_id: str
