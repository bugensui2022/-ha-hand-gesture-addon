name: "Bluetooth Classic Presence"
version: "1.0.8"
slug: "bluetooth_classic_presence"
description: "使用 l2ping 的高性能经典蓝牙追踪器 (device_tracker.mbzbt)，支持状态保持"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
host_network: true
privileged:
  - SYS_ADMIN
  - NET_ADMIN
full_access: true
devices:
  - /dev/hci0:/dev/hci0
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  target_mac: "FC:E8:06:19:19:E3"
  scan_interval: 2
  adapter_id: "hci0"
  offline_tolerance: 3
schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str?
  mqtt_password: password?
  target_mac: str
  scan_interval: int
  adapter_id: str
  offline_tolerance: int
