name: "Bluetooth Classic Presence"
version: "1.1.4a"
slug: "bluetooth_classic_presence"
description: "使用 l2ping 的高性能经典蓝牙设备追踪器 (device_tracker)，支持自动连接和 HA 状态恢复"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: "mqtt"
  mqtt_password: "mqtt"
  target_mac: "FC:E8:06:19:19:E3"
  scan_interval: 2
  offline_tolerance: 3
  connection_delay: 2
  adapter_id: "hci0"
schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str?
  mqtt_password: password?
  target_mac: str
  scan_interval: int
  offline_tolerance: int
  connection_delay: int
  adapter_id: str
