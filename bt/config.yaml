name: "Bluetooth Classic Presence"
version: "1.0.5"
slug: "bluetooth_classic_presence"
description: "优化版经典蓝牙扫描：采用 l2ping 机制，支持防抖动逻辑和精简日志"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
host_network: true
privileged:
  - SYS_ADMIN
  - NET_ADMIN
full_access: true
devices:
  - /dev/hci0:/dev/hci0
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  target_mac: "FC:E8:06:19:19:E3"
  scan_interval: 10
  adapter_id: "hci0"
schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str?
  mqtt_password: password?
  target_mac: str
  scan_interval: int
  adapter_id: str
