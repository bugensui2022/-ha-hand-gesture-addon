name: "Hand Gesture Recognition (Robust & Auto-detect 8 Gestures)"
version: "3.9.3"
slug: "hand_gesture_recognition_single"
description: "基于 Google MediaPipe 的高性能手势识别加载项。支持 8 种高稳定低延迟手势交互：握拳 (✊ Fist)、张开挥手 (👋 Wave)、剪刀手 (✌️ Victory)、点赞 (👍 Thumbs Up)、踩 (👎 Thumbs Down)、食指指向 (☝️ Point Up)、摇滚 (🤟 Rock On)、OK手势 (👌 OK)。具备极致的单流自适应无延迟静默重连、None 1秒防抖自动复位、冷静期机制、Home Assistant MQTT 实体自动发现，即插即用。"
url: "https://github.com/bugensui2022/-ha-hand-gesture-addon"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: "services"
boot: "auto"
options:
  rtsp_url: "rtsp://192.168.0.15:8554/live"
  reconnect_interval: 5
  mqtt_host: "192.168.0.16"
  mqtt_port: 1883
  mqtt_username: "mqtt"
  mqtt_password: "mqtt"
  mqtt_topic: "homeassistant/sensor/hand_gesture/state"
  sensor_name: "手势识别传感器"
  reset_hand_status_time: 3
schema:
  rtsp_url: str?
  reconnect_interval: int
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_topic: str
  sensor_name: str
  reset_hand_status_time: float
