name: "Hand Gesture Recognition (with Robust Reconnect & Autodiscover)"
version: "3.7.0"
slug: "hand_gesture_recognition_single"
description: "Robust hand gesture recognition using MediaPipe. Automatically restarts stream connection on drop. Registers as Home Assistant Entity using MQTT Discovery."
arch:
  - aarch64
  - amd64
startup: "services"
boot: "auto"
options:
  rtsp_url: "rtsp://192.168.0.15:8554/live"
  reconnect_interval: 5
  mqtt_host: "192.168.0.16"
  mqtt_port: 1883
  mqtt_username: "mqtt"
  mqtt_password: "mqtt"
  mqtt_topic: "homeassistant/sensor/hand_gesture/state"
  sensor_name: "手势识别传感器"
  reset_hand_status_time: 3
schema:
  rtsp_url: "str"
  reconnect_interval: "int"
  mqtt_host: "str"
  mqtt_port: "port"
  mqtt_username: "str"
  mqtt_password: "str"
  mqtt_topic: "str"
  sensor_name: "str"
  reset_hand_status_time: "float"
